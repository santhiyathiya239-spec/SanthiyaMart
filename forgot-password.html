<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Santhiya Mart - Forgot Password</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; justify-content: center;
      align-items: center; padding: 20px; font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f3ff, #eef2ff);
    }
    .container {
      width: 100%; max-width: 420px; padding: 30px; background: #fff;
      border-radius: 16px; box-shadow: 0 12px 35px #312e811a;
    }
    h1, h2 { text-align: center; }
    h1 { color: #6d28d9; margin: 0 0 8px; }
    h2 { color: #1f2937; margin: 0 0 22px; }
    p { color: #4b5563; line-height: 1.5; }
    input, button {
      width: 100%; padding: 13px; margin-top: 12px; border-radius: 8px;
      font-size: 15px;
    }
    input { border: 1px solid #d1d5db; outline-color: #7c3aed; }
    button {
      border: 0; background: #6d28d9; color: white; font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #5b21b6; }
    button:disabled { opacity: .65; cursor: wait; }
    .hidden { display: none; }
    #message { text-align: center; overflow-wrap: anywhere; }
    a { display: block; text-align: center; margin-top: 18px; color: #6d28d9; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Santhiya Mart</h1>
    <h2>Forgot Password</h2>

    <form id="emailForm">
      <p>Enter your registered email address to request an OTP.</p>
      <input type="email" id="email" placeholder="Registered email address" required>
      <button type="submit">Send OTP</button>
    </form>

    <form id="otpForm" class="hidden">
      <p>Enter the 6-digit OTP sent to your email.</p>
      <input type="text" id="otp" placeholder="6-digit OTP" maxlength="6"
             pattern="[0-9]{6}" inputmode="numeric" autocomplete="one-time-code" required>
      <button type="submit">Verify OTP</button>
    </form>

    <form id="passwordForm" class="hidden">
      <p>Create your new password.</p>
      <input type="password" id="newPassword" placeholder="New password"
             minlength="8" autocomplete="new-password" required>
      <input type="password" id="confirmPassword" placeholder="Confirm new password"
             minlength="8" autocomplete="new-password" required>
      <button type="submit">Reset Password</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <a href="login.html">Back to Login</a>
  </main>

  <script>
    const emailForm = document.getElementById("emailForm");
    const otpForm = document.getElementById("otpForm");
    const passwordForm = document.getElementById("passwordForm");
    const message = document.getElementById("message");
    const emailInput = document.getElementById("email");

    async function sendRequest(url, body) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || "Request failed. Check the server and API route.");
      return data;
    }

    emailForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Sending OTP...";
      try {
        const data = await sendRequest("/api/auth/forgot-password", {
          email: emailInput.value.trim()
        });
        message.textContent = data.message || "If the account exists, check your email for the OTP.";
        otpForm.classList.remove("hidden");
      } catch (error) {
        message.textContent = error.message || "Server connection failed.";
      }
    });

    otpForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Verifying OTP...";
      try {
        const data = await sendRequest("/api/auth/verify-reset-otp", {
          email: emailInput.value.trim(),
          otp: document.getElementById("otp").value.trim()
        });
        message.textContent = data.message || "OTP verified.";
        passwordForm.classList.remove("hidden");
      } catch (error) {
        message.textContent = error.message || "OTP verification failed.";
      }
    });

    passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (newPassword !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }
      message.textContent = "Resetting password...";
      try {
        const data = await sendRequest("/api/auth/reset-password", {
          email: emailInput.value.trim(),
          newPassword,
          confirmPassword
        });
        message.textContent = data.message || "Password reset successful.";
        emailForm.classList.add("hidden");
        otpForm.classList.add("hidden");
        passwordForm.classList.add("hidden");
      } catch (error) {
        message.textContent = error.message || "Password reset failed.";
      }
    });
  </script>
</body>
</html>
