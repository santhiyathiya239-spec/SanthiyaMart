
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SANTHIYA GROCERY MART - Register</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #e5f3e8, #fffdf7);
        }

        .register-container {
            width: 420px;
            max-width: 100%;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 50px;
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            color: #176b52;
            font-size: 27px;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: #a47c32;
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #24352b;
            margin-bottom: 18px;
        }

        .register-form {
            text-align: left;
        }

        label {
            display: block;
            margin-top: 13px;
            margin-bottom: 6px;
            color: #24352b;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #176b52;
        }

        .register-btn {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #176b52;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #123f32;
        }

        .login-text {
            margin-top: 20px;
            color: #555;
            text-align: center;
        }

        .login-text a {
            color: #176b52;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover,
        .back-home:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            margin-top: 18px;
            color: #a47c32;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
        }

        @media (max-width: 450px) {
            .register-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <div class="register-container">

        <div class="logo">🛒</div>

        <h1>SANTHIYA</h1>
        <div class="subtitle">GROCERY MART</div>

        <h2>Create Your Account</h2>

        <form class="register-form" onsubmit="registerUser(event)">

            <label for="role">Register As</label>
            <select id="role" required>
                <option value="">Choose your role</option>
                <option value="buyer">Buyer 🛍️</option>
                <option value="seller">Seller 🏪</option>
            </select>

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                autocomplete="name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                placeholder="Create a username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="4"
                required
            >

            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="register-btn">
                Create Account 🛒
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>
    </div>

    <script>
        function registerUser(event) {
            event.preventDefault();

            const role = document.getElementById("role").value;
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (!role) {
                alert("Please choose Buyer or Seller.");
                return;
            }

            if (password !== confirmPassword) {
                alert("Passwords do not match!");
                return;
            }

            // Save the selected role for the login page.
            localStorage.setItem("selectedRole", role);

            // This is currently a frontend demo, not database registration.
            const demoRegistration = {
                role: role,
                name: name,
                email: email,
                username: username
            };

            localStorage.setItem(
                "pendingRegistration",
                JSON.stringify(demoRegistration)
            );

            alert(
                "Details accepted! 🎉\n\n" +
                "Welcome to SANTHIYA GROCERY MART, " + name +
                "\nRole: " + role.toUpperCase() +
                "\n\nPlease log in to continue."
            );

            window.location.href = "login.html";
        }
    </script>
</body>
</html>
